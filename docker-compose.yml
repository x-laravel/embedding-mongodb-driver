services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: embedding_test
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--username", "root", "--password", "password", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  php83:
    build:
      context: .
      args:
        PHP_VERSION: "8.3"
    volumes:
      - .:/app
      - vendor83:/app/vendor
    environment:
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_DATABASE=embedding_test
      - DB_USERNAME=root
      - DB_PASSWORD=password
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["sh", "-c", "composer install --no-interaction && vendor/bin/phpunit"]
    profiles: ["php83"]

  php84:
    build:
      context: .
      args:
        PHP_VERSION: "8.4"
    volumes:
      - .:/app
      - vendor84:/app/vendor
    environment:
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_DATABASE=embedding_test
      - DB_USERNAME=root
      - DB_PASSWORD=password
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["sh", "-c", "composer install --no-interaction && vendor/bin/phpunit"]
    profiles: ["php84"]

  php85:
    build:
      context: .
      args:
        PHP_VERSION: "8.5"
    volumes:
      - .:/app
      - vendor85:/app/vendor
    environment:
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_DATABASE=embedding_test
      - DB_USERNAME=root
      - DB_PASSWORD=password
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["sh", "-c", "composer install --no-interaction && vendor/bin/phpunit"]
    profiles: ["php85"]

volumes:
  vendor83:
  vendor84:
  vendor85:
